# Deploys the site to GitHub Pages.
#
# Manual-trigger only by default, because `actions/deploy-pages` fails if
# Pages has not been enabled for the repository — and a workflow that fails
# on every push is noise that trains you to ignore the Actions tab.
#
# For a *project* site (https://<user>.github.io/AJ) the app must be built
# with a base path, which is what BASE_PATH below does. For a user site
# (https://<user>.github.io) set BASE_PATH to an empty string.
#
# Vercel is simpler if you have the option — it needs no configuration at
# all and keeps image optimisation, which this static export gives up.

name: Deploy to GitHub Pages

# Manual only, until Pages is switched on for this repository.
#
# Enabling it: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then either run this from the Actions tab, or uncomment
# the push trigger below to deploy on every push to main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued one rather than a running
# one, so an in-flight deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build static export
        env:
          STATIC_EXPORT: 'true'
          # Repository name, for a project-site base path. Empty for a user
          # site served from the domain root.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Confirm the APK made it into the export
        # The whole point of the site is the download; a deploy that quietly
        # drops the package is worse than a failed one.
        run: |
          apk=$(find out/downloads -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in out/downloads — the download would 404."
            exit 1
          fi
          echo "Found $apk ($(du -h "$apk" | cut -f1))"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
