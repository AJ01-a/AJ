# Deploys the site to GitHub Pages.
#
# This is the live deployment. Every push to main rebuilds and publishes.
#
# For a *project* site (https://<user>.github.io/AJ) the app must be built
# with a base path, which is what BASE_PATH below does, and the canonical
# URL must include it too — see the "Resolve the public URL" step. For a
# user site (https://<user>.github.io) set BASE_PATH to an empty string.
#
# A static export gives up two things a Node host would provide: image
# optimisation at request time (which is why the screenshots are pre-encoded
# as WebP), and custom response headers. See README > Deploying.

name: Deploy to GitHub Pages

# Requires Pages to be switched on for the repository, with
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Without it `actions/deploy-pages` fails with a 404.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued one rather than a running
# one, so an in-flight deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Resolve the public URL
        id: site
        # The canonical link, the Open Graph image and the sitemap all need
        # the absolute origin, including the project-site subdirectory.
        # github.repository_owner keeps the owner's original casing, but
        # Pages hostnames are lower-case, so it has to be folded here.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          url="https://${owner}.github.io/${{ github.event.repository.name }}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Building for $url"

      - name: Build static export
        env:
          STATIC_EXPORT: 'true'
          # Repository name, for a project-site base path. Empty for a user
          # site served from the domain root.
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: ${{ steps.site.outputs.url }}
        run: npm run build

      - name: Confirm no placeholder origin was published
        # A build that silently fell back to the placeholder would ship a
        # canonical URL and an OG image that do not resolve.
        run: |
          if grep -rq 'YOURDOMAIN' out/; then
            echo "::error::Placeholder origin found in the export — SITE_URL did not take effect."
            exit 1
          fi

      - name: Confirm asset paths carry the base path
        # A project site is served from a subdirectory, so any root-relative
        # path Next does not rewrite for us (a plain <a href>, the manifest)
        # 404s unless it was built through src/config/base-path.ts. The
        # download link is the one that matters most - it is the whole point
        # of the site.
        run: |
          base="/${{ github.event.repository.name }}"
          fail=0
          if ! grep -q "href=\"$base/downloads/" out/index.html; then
            echo "::error::The download link is missing the $base prefix — it would 404."
            fail=1
          fi
          if ! grep -q "\"start_url\": *\"$base/\"" out/manifest.webmanifest; then
            echo "::error::manifest start_url is missing the $base prefix."
            fail=1
          fi
          exit $fail

      - name: Confirm the APK made it into the export
        # The whole point of the site is the download; a deploy that quietly
        # drops the package is worse than a failed one.
        run: |
          apk=$(find out/downloads -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found in out/downloads — the download would 404."
            exit 1
          fi
          echo "Found $apk ($(du -h "$apk" | cut -f1))"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
